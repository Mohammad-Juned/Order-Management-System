<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <h1>Order Management</h1>
    <nav id="nav"></nav>
</header>

<div id="msg" class="msg" hidden></div>

<main>
    <!-- LOGIN / REGISTER -->
    <section id="auth-view">
        <div class="auth-box">
            <form id="loginForm" class="panel" onsubmit="login(event)">
                <h2>Login</h2>
                <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" required>
                <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Login</button>
                <p class="switch">Don't have an account? <a href="#" onclick="showAuthForm('register'); return false;">Register</a></p>
            </form>

            <form id="registerForm" class="panel" onsubmit="register(event)" hidden>
                <h2>Register</h2>
                <input id="regName" type="text" placeholder="Name" autocomplete="off" required>
                <input id="regEmail" type="email" placeholder="Email" autocomplete="off" required>
                <input id="regPassword" type="password" placeholder="Password (min 6 chars)" autocomplete="new-password" required>
                <button type="submit">Register</button>
                <p class="switch">Already registered? <a href="#" onclick="showAuthForm('login'); return false;">Login</a></p>
            </form>
        </div>
    </section>

    <!-- PRODUCTS -->
    <section id="products-view" hidden>
        <form id="adminForm" class="panel" onsubmit="saveProduct(event)" hidden>
            <h2 id="formTitle">Add Product (Admin)</h2>
            <input type="hidden" id="editId">
            <div class="row">
                <input id="pName" type="text" placeholder="Product name">
                <input id="pPrice" type="number" step="0.01" placeholder="Price">
                <input id="pQty" type="number" placeholder="Quantity">
            </div>
            <div class="row">
                <button type="submit">Save</button>
                <button type="button" class="grey" onclick="resetProductForm()">Clear</button>
            </div>
        </form>
        <h2>Products</h2>
        <div id="productList" class="grid"></div>
    </section>

    <!-- CART -->
    <section id="cart-view" hidden>
        <h2>My Cart</h2>
        <div id="cartBox"></div>
    </section>

    <!-- ORDERS -->
    <section id="orders-view" hidden>
        <h2>My Orders</h2>
        <div id="orderList"></div>
    </section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
